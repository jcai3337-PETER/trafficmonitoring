<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>即時交通事件地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
  #map { height: 600px; width: 100%; }
  #event-list { max-height: 300px; overflow-y: auto; margin-top: 10px; }
  .event-item { padding: 5px; border-bottom: 1px solid #ccc; }
  #last-update { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<h2>台灣即時交通事件</h2>
<div id="map"></div>
<div id="last-update">上次更新時間: --</div>
<div id="event-list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map = L.map('map').setView([23.7, 120.9], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let markers = [];

const eventColors = {
  "交通事故": "red",
  "施工路段": "orange",
  "交通管制或交通改道": "purple",
  "道路堵塞": "yellow",
  "掉落物": "brown",
  "其他事件": "blue"
};

async function loadEvents() {
  try {
    const response = await fetch('https://raw.githubusercontent.com/jcai3337-PETER/trafficmonitoring/main/taiwan_traffic.json');
    const events = await response.json();

    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const eventListDiv = document.getElementById('event-list');
    eventListDiv.innerHTML = '';

    let lastUpdateTime = "--";

    events.forEach(event => {
      if (!event.lat || !event.lng) return;
      if(event.time) lastUpdateTime = event.time;

      const color = eventColors[event.EventTypeName] || "gray";

      const marker = L.circleMarker([event.lat, event.lng], {
        radius: 8,
        color: "#000",
        weight: 1,
        fillColor: color,
        fillOpacity: 0.8
      }).addTo(map);

      marker.bindPopup(`<b>${event.EventTypeName}</b><br>${event.comment}<br>${event.time}`);
      markers.push(marker);

      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `<span style="color:${color}"><b>${event.EventTypeName}</b></span>: ${event.comment} <small>(${event.time})</small>`;
      eventListDiv.appendChild(div);
    });

    document.getElementById('last-update').innerText = "上次更新時間: " + lastUpdateTime;
  } catch (err) {
    console.error("載入事件資料失敗:", err);
  }
}

loadEvents();
setInterval(loadEvents, 10000);
</script>
</body>
</html>
