<script>
// 指定 JSON 的相對路徑（與 index.html 同資料夾）
const jsonURL = "./road_data.json";

async function loadEvents() {
  try {
    const response = await fetch(jsonURL);
    if (!response.ok) throw new Error("Fetch 失敗");
    const events = await response.json();

    // 清除舊的 marker
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const eventListDiv = document.getElementById('event-list');
    eventListDiv.innerHTML = '';

    let lastUpdateTime = "--";

    events.forEach(event => {
      const lat = parseFloat(event.y1);
      const lng = parseFloat(event.x1);
      if (!lat || !lng) return;

      // 分類對應
      let category = "其他";
      switch (event.roadtype) {
        case "道路施工": category = "道路施工"; break;
        case "交通事故": category = "事故"; break;
        case "交通管制": category = "交通管制"; break;
        case "阻塞": category = "阻塞"; break;
        default: category = "其他"; break;
      }

      const color = categories[category] || "gray";

      const marker = L.circleMarker([lat, lng], {
        radius: 8,
        color: "#000",
        weight: 1,
        fillColor: color,
        fillOpacity: 0.8
      }).addTo(map);

      marker.bindPopup(`
        <b>${category}</b><br>
        ${event.comment || "無描述"}<br>
        <small>${event.happendate} ${event.happentime}</small><br>
        <i>來源: ${event.srcdetail || "未知"}</i>
      `);

      markers.push(marker);

      // 事件列表
      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `<span style="color:${color};font-weight:bold">${category}</span> - ${event.comment || "無描述"} <small>(${event.happendate} ${event.happentime})</small> <i>[${event.srcdetail || "未知"}]</i>`;
      div.onclick = () => map.setView([lat, lng], 13);
      eventListDiv.appendChild(div);

      lastUpdateTime = event.modDttm || lastUpdateTime;
    });

    document.getElementById('last-update').innerText = "上次更新時間: " + lastUpdateTime;

  } catch (err) {
    console.error("讀取 JSON 失敗:", err);
    alert("無法讀取 JSON，請確認 JSON 與 HTML 在同一個資料夾。");
  }
}

// 初始化
loadEvents();
setInterval(loadEvents, 10000); // 每 10 秒自動更新
</script>
