<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>台灣道路監測地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        #map { height: 100vh; width: 100%; margin: 0; padding: 0; }
        body { margin: 0; padding: 0; }
        #no-coords {
            position: absolute;
            bottom: 10px;
            right: 10px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
            z-index: 1000;
        }
        #no-coords p {
            margin: 0 0 3px 0;
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div id="no-coords"><strong>無經緯度事件：</strong></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 初始化地圖
const map = L.map('map').setView([22.6273, 120.3014], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// GitHub raw URL (改成你的帳號)
const jsonURL = 'https://raw.githubusercontent.com/jcai3337-PETER/trafficmonitoring/main/taiwan_traffic.json';

// 容器
const noCoordsDiv = document.getElementById('no-coords');
const markerMap = new Map(); // EventID -> marker

fetch(jsonURL)
    .then(res => {
        if(!res.ok) throw new Error('HTTP error ' + res.status);
        return res.json();
    })
    .then(data => {
        const markers = [];

        data.forEach(item => {
            if(item.Latitude && item.Longitude) {
                // 有經緯度
                let color = 'blue';
                if(item.EventType === 1) color = 'red';

                const marker = L.circleMarker([item.Latitude, item.Longitude], {
                    radius: 8,
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.7
                }).bindPopup(`
                    <strong>${item.Description}</strong><br>
                    ID: ${item.EventID}<br>
                    類型: ${item.EventTitle}<br>
                    發布時間: ${item.PublishTime}<br>
                    更新時間: ${item.UpdateTime}<br>
                    清除: ${item.IsCleared ? '是' : '否'}
                `);
                marker.addTo(map);
                markers.push(marker);
                markerMap.set(item.EventID, marker);
            } else {
                // 無經緯度事件
                const p = document.createElement('p');
                p.textContent = `ID: ${item.EventID}, ${item.Description}`;
                p.addEventListener('click', () => {
                    alert('此事件沒有經緯度，無法定位地圖');
                });
                noCoordsDiv.appendChild(p);
            }
        });

        if(markers.length > 0){
            const group = L.featureGroup(markers);
            map.fitBounds(group.getBounds());
        }
    })
    .catch(err => console.error('讀取 JSON 失敗:', err));
</script>
</body>
</html>
