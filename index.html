<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>即時交通事件地圖</title>
<style>
  #map { height: 600px; width: 100%; }
  #event-list { max-height: 300px; overflow-y: auto; margin-top: 10px; }
  .event-item { padding: 5px; border-bottom: 1px solid #ccc; }
  #last-update { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<h2>台灣即時交通事件</h2>
<div id="map"></div>
<div id="last-update">上次更新時間: --</div>
<div id="event-list"></div>

<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>
<script>
let map;
let markers = [];

// 事件類型對應顏色
const eventColors = {
  "交通事故": "red",
  "施工路段": "orange",
  "交通管制或交通改道": "purple",
  "道路堵塞": "yellow",
  "掉落物": "brown",
  "其他事件": "blue"
};

// 初始化地圖
function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 23.7, lng: 120.9 },
    zoom: 7
  });
  loadEvents(); // 初始載入
  setInterval(loadEvents, 10000); // 每 10 秒更新
}

// 載入 JSON 事件資料
async function loadEvents() {
  try {
    const response = await fetch('data/taiwan_traffic.json');
    const events = await response.json();

    // 清除舊標記
    markers.forEach(m => m.setMap(null));
    markers = [];

    const eventListDiv = document.getElementById('event-list');
    eventListDiv.innerHTML = '';

    let lastUpdateTime = "--";

    events.forEach(event => {
      // 記錄最新時間
      if(event.UpdateTime) lastUpdateTime = event.UpdateTime;

      if (event.lat && event.lng) {
        const color = eventColors[event.EventTypeName] || "gray";

        const marker = new google.maps.Marker({
          position: { lat: event.lat, lng: event.lng },
          map: map,
          title: event.comment,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: color,
            fillOpacity: 0.8,
            strokeWeight: 1,
            strokeColor: "#000"
          }
        });

        const infoWindow = new google.maps.InfoWindow({
          content: `<b>${event.EventTypeName || "未知事件"}</b><br>${event.comment}<br>${event.time}`
        });

        marker.addListener('click', () => infoWindow.open(map, marker));
        markers.push(marker);
      }

      // 事件列表
      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `<span style="color:${eventColors[event.EventTypeName]||'gray'}"><b>${event.EventTypeName || '未知'}</b></span>: ${event.comment} <small>(${event.time})</small>`;
      eventListDiv.appendChild(div);
    });

    document.getElementById('last-update').innerText = "上次更新時間: " + lastUpdateTime;
  } catch (err) {
    console.error("載入事件資料失敗:", err);
  }
}

// 啟動地圖
initMap();
</script>
</body>
</html>
