<script>
let map = L.map('map').setView([23.7, 120.9], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let markers = [];
const categories = {
  "事故": "red",
  "交通管制": "purple",
  "交通障礙": "yellow",
  "其他": "blue",
  "災變": "brown",
  "號誌故障": "gray",
  "道路施工": "orange",
  "阻塞": "black"
};

const GITHUB_REPO_API = "https://api.github.com/repos/jcai3337-PETER/trafficmonitoring/contents/road_data.json";

async function loadEvents() {
  try {
    // 1️⃣ 取得 JSON 檔案本身內容
    const response = await fetch("./road_data.json");
    if (!response.ok) throw new Error("讀取 JSON 失敗");
    const events = await response.json();

    // 2️⃣ 清除舊標記
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    const eventListDiv = document.getElementById('event-list');
    eventListDiv.innerHTML = '';

    events.forEach(event => {
      const lat = parseFloat(event.y1);
      const lng = parseFloat(event.x1);
      if (!lat || !lng) return;

      let category = "其他";
      switch (event.roadtype) {
        case "道路施工": category = "道路施工"; break;
        case "交通事故": category = "事故"; break;
        case "交通管制": category = "交通管制"; break;
        case "阻塞": category = "阻塞"; break;
      }
      const color = categories[category] || "gray";

      const marker = L.circleMarker([lat, lng], {
        radius: 8,
        color: "#000",
        weight: 1,
        fillColor: color,
        fillOpacity: 0.8
      }).addTo(map);

      marker.bindPopup(`
        <b>${category}</b><br>
        ${event.comment || "無描述"}<br>
        <small>${event.happendate} ${event.happentime}</small><br>
        <i>來源: ${event.srcdetail || "未知"}</i>
      `);

      markers.push(marker);

      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `<span style="color:${color};font-weight:bold">${category}</span> - ${event.comment || "無描述"} <small>(${event.happendate} ${event.happentime})</small> <i>[${event.srcdetail || "未知"}]</i>`;
      div.onclick = () => marker.openPopup();
      eventListDiv.appendChild(div);
    });

    // 3️⃣ 取得 GitHub 上 JSON 的最後更新時間
    const githubResp = await fetch(GITHUB_REPO_API);
    if (!githubResp.ok) throw new Error("無法取得 GitHub 檔案資訊");
    const githubData = await githubResp.json();
    const updatedAt = new Date(githubData.git_url ? githubData.git_url : githubData.download_url); // fallback
    // 另一種方法是用 githubData.commit.commit.author.date 需要額外呼叫 commits API
    document.getElementById('last-update').innerText = "上次更新時間 (GitHub): " + githubData.git_url;

  } catch (err) {
    console.error(err);
    alert("無法讀取 JSON 或 GitHub 資料。");
  }
}

// 初始化
loadEvents();
</script>
