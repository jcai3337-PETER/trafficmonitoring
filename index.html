<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>即時交通事件地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; margin: 20px; }
  h2 { text-align: center; }
  #map { height: 600px; width: 100%; border-radius: 10px; }
  #event-list { max-height: 300px; overflow-y: auto; margin-top: 10px; border: 1px solid #ccc; border-radius: 6px; padding: 5px; }
  .event-item { padding: 6px; border-bottom: 1px solid #eee; }
  .event-item:hover { background-color: #f5f5f5; cursor: pointer; }
  #last-update { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<h2>🚦 台灣即時交通事件地圖</h2>
<div id="map"></div>
<div id="last-update">上次更新時間: --</div>
<div id="event-list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map = L.map('map').setView([23.7, 120.9], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let markers = [];

// 各事件類型顏色
const eventColors = {
  "交通事故": "red",
  "施工路段": "orange",
  "交通管制或交通改道": "purple",
  "道路堵塞": "yellow",
  "掉落物": "brown",
  "其他事件": "blue"
};

// 載入事件資料
async function loadEvents() {
  try {
    const response = await fetch('https://jcai3337-PETER.github.io/trafficmonitoring/taiwan_traffic.json?_=' + Date.now());
    const events = await response.json();

    // 清空舊資料
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    const eventListDiv = document.getElementById('event-list');
    eventListDiv.innerHTML = '';

    let lastUpdateTime = "--";

    // 顯示事件
    events.forEach(event => {
      if (!event.lat || !event.lng) return;
      if (event.time) lastUpdateTime = event.time;

      const color = eventColors[event.EventTypeName] || "gray";
      const marker = L.circleMarker([event.lat, event.lng], {
        radius: 8,
        color: "#000",
        weight: 1,
        fillColor: color,
        fillOpacity: 0.8
      }).addTo(map);

      marker.bindPopup(`
        <b>${event.EventTypeName || "未知事件"}</b><br>
        ${event.comment || "無描述"}<br>
        <small>${event.time || ""}</small><br>
        <i>來源: ${event.source || "未知"}</i>
      `);

      markers.push(marker);

      // 事件列表
      const div = document.createElement('div');
      div.className = 'event-item';
      div.innerHTML = `<span style="color:${color};font-weight:bold">${event.EventTypeName || '未知'}</span> - ${event.comment || "無描述"} <small>(${event.time || ""})</small> <i>[${event.source || "未知"}]</i>`;
      div.onclick = () => map.setView([event.lat, event.lng], 13);
      eventListDiv.appendChild(div);
    });

    document.getElementById('last-update').innerText = "上次更新時間: " + lastUpdateTime;

  } catch (err) {
    console.error("載入事件資料失敗:", err);
  }
}

// 初始化與自動更新
loadEvents();
setInterval(loadEvents, 10000); // 每10秒更新一次
</script>
</body>
</html>
