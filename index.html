<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>高雄道路監測地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        #map { height: 100vh; width: 100%; margin: 0; padding: 0; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 初始化地圖
const map = L.map('map').setView([22.6273, 120.3014], 12);

// 使用 OpenStreetMap 圖資
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// 讀取 GitHub 上的 JSON
fetch('https://raw.githubusercontent.com/username/kaohsiung-map/main/traffic.json')
    .then(response => response.json())
    .then(trafficData => {
        // 建立 marker
        const markers = trafficData.map(item => {
            return L.marker([item.Latitude, item.Longitude])
                .bindPopup(`<strong>${item.Description}</strong><br>ID: ${item.EventID}<br>更新: ${item.UpdateTime}`);
        });

        // 建立群組並加到地圖
        const group = L.featureGroup(markers).addTo(map);

        // 自動縮放到所有標記
        map.fitBounds(group.getBounds());
    })
    .catch(err => console.error('讀取 JSON 發生錯誤:', err));
</script>
</body>
</html>
